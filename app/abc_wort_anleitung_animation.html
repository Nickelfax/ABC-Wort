<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#4a90d9">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Wort – Anleitung</title>
<style>
    :root {
        --primary: #4a90e2;
        --secondary: #f5a623;
        --success: #2ecc71;
        --danger: #e74c3c;
        --purple: #9b59b6;
        --bg: #0f1420;
        --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #stage {
        position: relative; width: 100vw; height: 100vh; max-width: 900px; max-height: 900px;
        background: var(--card-bg); display: flex; align-items: center; justify-content: center;
    }
    .scene {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.5s ease; gap: 30px; padding: 20px;
    }
    .scene.aktiv { opacity: 1; pointer-events: auto; }

    .icon-gross { font-size: 8rem; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15)); }

    .demo-flaeche { display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 120px; }
    .kachel { background: #eef6ff; border: 4px solid var(--primary); border-radius: 20px; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; font-weight: bold; color: #2c3e50; transition: transform 0.35s ease, opacity 0.35s ease; }
    .kachel.leer { border-style: dashed; background: transparent; color: #cfd8e3; }
    .kachel.wort-wechselt { transform: scale(0) rotate(15deg); opacity: 0; }

    .finger { position: absolute; font-size: 4rem; z-index: 10; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25)); }
    @keyframes tippen {
        0%   { transform: translate(60px, 100px) scale(1); }
        35%  { transform: translate(0, 0) scale(0.85); }
        50%  { transform: translate(0, 0) scale(0.7); }
        65%  { transform: translate(0, 0) scale(0.85); }
        100% { transform: translate(60px, 100px) scale(1); }
    }
    .finger.animiert { animation: tippen 2.2s ease-in-out infinite; }

    @keyframes puls { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .puls { animation: puls 1.1s ease-in-out infinite; }

    @keyframes welle { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
    .schallwelle {
        position: absolute; width: 60px; height: 60px; border: 4px solid var(--secondary);
        border-radius: 50%; animation: welle 1.4s ease-out infinite;
    }
    .schallwelle:nth-child(2) { animation-delay: 0.4s; }
    .schallwelle:nth-child(3) { animation-delay: 0.8s; }

    @keyframes rotieren { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .rotierend { animation: rotieren 1.6s linear infinite; }

    @keyframes vorschieben {
        0% { transform: translateX(0); opacity: 1; } 45% { transform: translateX(-70px); opacity: 0; }
        50% { transform: translateX(70px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; }
    }
    .schiebe-wort { animation: vorschieben 2.4s ease-in-out infinite; }

    @keyframes schrumpfen {
        0%, 60% { transform: scale(1); opacity: 1; } 80%, 100% { transform: scale(0); opacity: 0; }
    }
    .schrumpft { animation: schrumpfen 2.2s ease-in-out infinite; }

    @keyframes buchstabeErscheint { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }

    @keyframes toggleFarbe { 0%, 20% { background: #ccc; } 50%, 80% { background: var(--primary); } 100% { background: #ccc; } }
    .uebersetzung-toggle { width: 70px; height: 38px; border-radius: 20px; position: relative; animation: toggleFarbe 2.4s ease-in-out infinite; }
    @keyframes toggleAn { 0%, 20% { left: 4px; } 50%, 80% { left: 36px; } 100% { left: 4px; } }
    .uebersetzung-toggle .kugel { position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: white; animation: toggleAn 2.4s ease-in-out infinite; }

    .flaggen-stapel { position: relative; width: 70px; height: 70px; }
    @keyframes flaggeWechsel { 0%, 5% { opacity: 0; } 10%, 25% { opacity: 1; } 30%, 100% { opacity: 0; } }
    .flagge { position: absolute; inset: 0; font-size: 3.4rem; display: flex; align-items: center; justify-content: center; opacity: 0; animation: flaggeWechsel 4.5s ease-in-out infinite; }
    .flagge:nth-child(1) { animation-delay: 0s; }
    .flagge:nth-child(2) { animation-delay: 1.5s; }
    .flagge:nth-child(3) { animation-delay: 3s; }

    .puzzle-reihe { display: flex; gap: 6px; }
    .puzzleteil { width: 56px; height: 56px; background: var(--secondary); border-radius: 10px; opacity: 0; transform: translateY(-40px) rotate(-15deg); animation: puzzle-fallen 2.4s ease-in-out infinite; }
    .puzzleteil:nth-child(1) { animation-delay: 0s; } .puzzleteil:nth-child(2) { animation-delay: 0.25s; }
    .puzzleteil:nth-child(3) { animation-delay: 0.5s; } .puzzleteil:nth-child(4) { animation-delay: 0.75s; }
    @keyframes puzzle-fallen { 0% { opacity: 0; transform: translateY(-40px) rotate(-15deg); } 30%, 80% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 1; transform: translateY(0) rotate(0deg); } }

    .avatar { font-size: 3.6rem; }
    .verbindungslinie { width: 0; height: 4px; background: var(--purple); border-radius: 2px; animation: linie-wachsen 2.2s ease-in-out infinite; }
    @keyframes linie-wachsen { 0%, 15% { width: 0; } 50% { width: 90px; } 85%, 100% { width: 90px; } }

    /* ===== Realistischer App-Mockup (Diktat- und Grammatik-Menü) ===== */
    .mockup-rahmen {
        width: 100%; max-width: 560px; background: #fafbfc; border-radius: 24px; border: 2px solid #e9ecef;
        padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08); position: relative;
    }
    .mockup-tastenreihe { display: flex; gap: 10px; width: 100%; }
    .haupt-btn {
        flex: 1; padding: 16px 8px; border-radius: 14px; border: 2px solid transparent; cursor: default;
        font-size: 1.15rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
    }
    .haupt-btn-diktat { background: #2c2c2a; color: white; }
    .haupt-btn-diktat.aktiv { background: #c0392b; }
    .haupt-btn-grammatik { background: #f8f9fa; color: #7f8c8d; border-color: #e9ecef; }
    .haupt-btn-grammatik.aktiv { background: var(--primary); color: white; border-color: var(--primary); }
    .haupt-btn svg { display: block; }

    .untermenu {
        display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap;
        max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.5s ease, opacity 0.5s ease, margin 0.5s ease;
    }
    .untermenu.offen { max-height: 140px; opacity: 1; }
    .mini-btn {
        background: #eee; color: #333; border: 2px solid #ccc; border-radius: 10px; padding: 10px 14px;
        font-size: 1.3rem; display: flex; align-items: center; gap: 4px; transition: all 0.4s ease;
    }
    .mini-btn.aktiv { background: var(--secondary); border-color: var(--secondary); color: white; }

    .beispiel-flaeche {
        width: 100%; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .beispiel-flaeche.zeigt { opacity: 1; transform: translateY(0); }

    .artikel-pille { padding: 14px 22px; border-radius: 14px; font-size: 1.7rem; font-weight: bold; color: white; position: relative; }
    .abzeichen-klein {
        position: absolute; top: -12px; right: -12px; background: var(--success); color: white; width: 26px; height: 26px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem;
        opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease; transform: scale(0);
    }
    .abzeichen-klein.zeigt { opacity: 1; transform: scale(1); }

    .mock-finger {
        position: absolute; font-size: 3rem; z-index: 30; opacity: 0;
        transform: translate(-50%, -35%) scale(1); transition: left 0.6s ease, top 0.6s ease, opacity 0.3s ease;
        filter: drop-shadow(0 6px 8px rgba(0,0,0,0.3));
    }
    .mock-finger.sichtbar { opacity: 1; }
    .mock-finger.tippt { animation: mini-tap 0.35s ease; }
    @keyframes mini-tap { 0% { transform: translate(-50%,-35%) scale(1); } 50% { transform: translate(-50%,-35%) scale(0.75); } 100% { transform: translate(-50%,-35%) scale(1); } }

    .buchstaben-reihe { display: flex; gap: 10px; }

    #leiste { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 22px; z-index: 20; }
    .steuer-btn { background: rgba(44,62,80,0.08); border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 1.6rem; cursor: pointer; color: #2c3e50; display: flex; align-items: center; justify-content: center; }
    .steuer-btn:active { transform: scale(0.9); }
    #punkte { display: flex; gap: 8px; }
    .punkt { width: 12px; height: 12px; border-radius: 50%; background: #d6dde5; cursor: pointer; border: none; padding: 0; }
    .punkt.aktiv { background: var(--primary); }
</style>
</head>
<body>

<div id="stage">

    <!-- ===== Hauptsteuerung: Wort tippen, hören, wiederholen, wechseln, löschen, speichern ===== -->
    <div class="scene" data-controller="haupt">
        <div class="mockup-rahmen">
            <div class="demo-flaeche zeigt" style="min-height:70px; gap:10px;">
                <div class="kachel" id="mHW1" style="width:64px;height:64px;font-size:1.8rem;">＿</div>
                <div class="kachel" id="mHW2" style="width:64px;height:64px;font-size:1.8rem;">＿</div>
                <div class="kachel" id="mHW3" style="width:64px;height:64px;font-size:1.8rem;">＿</div>
                <div class="kachel" id="mHW4" style="width:64px;height:64px;font-size:1.8rem;">＿</div>
            </div>
            <div class="untermenu offen" id="mHauptTasten">
                <div class="mini-btn" id="mHT1" style="background:#eef6ff; border-color:var(--primary); font-weight:bold;">B</div>
                <div class="mini-btn" id="mHT2" style="background:#eef6ff; border-color:var(--primary); font-weight:bold;">A</div>
                <div class="mini-btn" id="mHT3" style="background:#eef6ff; border-color:var(--primary); font-weight:bold;">L</div>
                <div class="mini-btn" id="mHT4" style="background:#eef6ff; border-color:var(--primary); font-weight:bold;">L</div>
            </div>
            <div class="mockup-tastenreihe" style="gap:8px; justify-content:center;">
                <div class="haupt-btn" id="mHRepeat" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#4a90e2; color:white; font-size:1.4rem; border-radius:50%;">🔁</div>
                <div class="haupt-btn" id="mHListen" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#2ecc71; color:white; font-size:1.4rem; border-radius:50%;">🔊</div>
                <div class="haupt-btn" id="mHPrev" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#eee; color:#2c3e50; font-size:1.4rem; border-radius:50%;">◀</div>
                <div class="haupt-btn" id="mHNext" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#eee; color:#2c3e50; font-size:1.4rem; border-radius:50%;">▶</div>
                <div class="haupt-btn" id="mHDel" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#e74c3c; color:white; font-size:1.4rem; border-radius:50%;">⌫</div>
                <div class="haupt-btn" id="mHSave" style="flex:0 0 auto; width:52px; height:52px; padding:0; background:#16a085; color:white; font-size:1.4rem; border-radius:50%; position:relative;">
                    📚<span class="abzeichen-klein" id="mHStern" style="background:var(--secondary);">⭐</span>
                </div>
            </div>
            <div class="mock-finger" id="mHauptFinger">👆</div>
        </div>
    </div>

    <div class="scene" data-icon="🌍">
        <div class="icon-gross puls" style="font-size:6rem;">🌍</div>
        <div class="uebersetzung-toggle"><div class="kugel"></div></div>
        <div style="display:flex; align-items:center; gap:22px;">
            <div class="kachel" style="width:80px; height:80px; font-size:2.4rem;">🏠</div>
            <span style="font-size:2rem;">➡️</span>
            <div class="flaggen-stapel"><span class="flagge">🇬🇧</span><span class="flagge">🇹🇷</span><span class="flagge">🇺🇦</span></div>
        </div>
    </div>

    <!-- ===== Diktat-Menü: echte Bedienführung ===== -->
    <div class="scene" data-controller="diktat">
        <div class="mockup-rahmen">
            <div class="mockup-tastenreihe">
                <div class="haupt-btn haupt-btn-diktat" id="mDiktatBtn">
                    <svg width="26" height="26" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="42" rx="42" ry="28" fill="#fdfaf0"/>
                        <path d="M28,64 L20,86 L42,68 Z" fill="#fdfaf0"/>
                        <rect x="45" y="22" width="10" height="24" rx="5" fill="#2c2c2a"/>
                        <circle cx="50" cy="54" r="5.5" fill="#2c2c2a"/>
                    </svg>
                    <span>Diktat</span>
                </div>
                <div class="haupt-btn haupt-btn-grammatik" style="opacity:0.4;"><span>❓</span></div>
            </div>
            <div class="untermenu" id="mDiktatMenu">
                <div class="mini-btn aktiv" id="mD1">🔤</div>
                <div class="mini-btn" id="mD2">➖</div>
                <div class="mini-btn" id="mD3">🙈</div>
                <div class="mini-btn" id="mD4">🔊</div>
            </div>
            <div class="beispiel-flaeche" id="mDiktatBeispiel">
                <div style="position:relative; display:flex; align-items:center; justify-content:center; width:110px; height:110px;">
                    <div class="schallwelle" style="border-color:var(--purple);"></div>
                    <div class="schallwelle" style="border-color:var(--purple);"></div>
                    <div class="icon-gross puls" style="font-size:4rem;">🔊</div>
                </div>
                <div class="buchstaben-reihe">
                    <div class="kachel" style="width:60px;height:60px;font-size:1.8rem;animation:buchstabeErscheint 0.4s ease-out 0.2s both;">H</div>
                    <div class="kachel" style="width:60px;height:60px;font-size:1.8rem;animation:buchstabeErscheint 0.4s ease-out 0.5s both;">U</div>
                    <div class="kachel" style="width:60px;height:60px;font-size:1.8rem;animation:buchstabeErscheint 0.4s ease-out 0.8s both;">N</div>
                    <div class="kachel" style="width:60px;height:60px;font-size:1.8rem;animation:buchstabeErscheint 0.4s ease-out 1.1s both;">D</div>
                </div>
            </div>
            <div class="mock-finger" id="mDiktatFinger">👆</div>
        </div>
    </div>

    <!-- ===== Grammatik-Menü: echte Bedienführung ===== -->
    <div class="scene" data-controller="grammatik">
        <div class="mockup-rahmen">
            <div class="mockup-tastenreihe">
                <div class="haupt-btn haupt-btn-diktat" style="opacity:0.4;">
                    <svg width="22" height="22" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="42" rx="42" ry="28" fill="#fdfaf0"/>
                        <path d="M28,64 L20,86 L42,68 Z" fill="#fdfaf0"/>
                        <rect x="45" y="22" width="10" height="24" rx="5" fill="#2c2c2a"/>
                        <circle cx="50" cy="54" r="5.5" fill="#2c2c2a"/>
                    </svg>
                </div>
                <div class="haupt-btn haupt-btn-grammatik" id="mGramBtn"><span>❓</span><span>Grammatik</span></div>
            </div>
            <div class="untermenu" id="mGramMenu">
                <div class="mini-btn aktiv" id="mG1" style="font-size:1rem;">👦👧🏠</div>
                <div class="mini-btn" id="mG2" style="font-size:0.95rem;">
                    <span style="color:#2c2c2a;font-weight:bold;">der</span>
                    <span style="color:#7b1fa2;font-weight:bold;">den</span>
                    <span style="color:#c2185b;font-weight:bold;">dem</span>
                </div>
                <div class="mini-btn" id="mG3">👉🧒👈</div>
                <div class="mini-btn" id="mG4">🕰️</div>
            </div>
            <div class="beispiel-flaeche" id="mGramBeispielArtikel">
                <div class="icon-gross" style="font-size:4.5rem;">🐕</div>
                <div style="display:flex; gap:14px;">
                    <div class="artikel-pille" style="background:#1565c0;" id="mPilleDer">der<div class="abzeichen-klein" id="mAbzDer">✓</div></div>
                    <div class="artikel-pille" style="background:#c62828;">die</div>
                    <div class="artikel-pille" style="background:#2e7d32;">das</div>
                </div>
            </div>
            <div class="beispiel-flaeche" id="mGramBeispielKasus" style="position:absolute;">
                <div style="font-size:2.4rem;">⚽</div>
                <div style="display:flex; gap:14px;">
                    <div class="artikel-pille" style="background:#2c2c2a;">der</div>
                    <div class="artikel-pille" style="background:#7b1fa2;" id="mPilleDen">den<div class="abzeichen-klein" id="mAbzDen">✓</div></div>
                    <div class="artikel-pille" style="background:#c2185b;">dem</div>
                </div>
            </div>
            <div class="beispiel-flaeche" id="mGramBeispielKonj" style="position:absolute;">
                <div style="font-size:1.5rem; color:#0097a7; font-weight:bold;">👤 ich</div>
                <div style="font-size:1.3rem; color:#7f8c8d;">＿＿＿</div>
                <div style="display:flex; gap:14px;">
                    <div class="artikel-pille" style="background:#0097a7;" id="mPilleSpiele">spiele<div class="abzeichen-klein" id="mAbzSpiele">✓</div></div>
                    <div class="artikel-pille" style="background:#0097a7; opacity:0.5;">spielst</div>
                    <div class="artikel-pille" style="background:#0097a7; opacity:0.5;">spielt</div>
                </div>
            </div>
            <div class="mock-finger" id="mGramFinger">👆</div>
        </div>
    </div>

    <!-- ===== Doppelfunktion: Diktat + Grammatik gleichzeitig ===== -->
    <div class="scene" data-controller="doppel">
        <div class="mockup-rahmen">
            <div style="display:flex; gap:10px;">
                <div style="font-size:1rem; font-weight:bold; color:var(--success); background:#eafaf1; padding:6px 16px; border-radius:10px;">✓ <span id="mDopRichtig">2</span></div>
                <div style="font-size:1rem; font-weight:bold; color:var(--danger); background:#fdecea; padding:6px 16px; border-radius:10px;">✗ <span id="mDopFalsch">0</span></div>
            </div>
            <div class="mockup-tastenreihe">
                <div class="haupt-btn haupt-btn-diktat aktiv" id="mDopDiktatBtn">
                    <svg width="22" height="22" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="42" rx="42" ry="28" fill="#fdfaf0"/>
                        <path d="M28,64 L20,86 L42,68 Z" fill="#fdfaf0"/>
                        <rect x="45" y="22" width="10" height="24" rx="5" fill="#2c2c2a"/>
                        <circle cx="50" cy="54" r="5.5" fill="#2c2c2a"/>
                    </svg>
                    <span>Diktat</span>
                </div>
                <div class="haupt-btn haupt-btn-grammatik" id="mDopGramBtn"><span>❓</span><span>Grammatik</span></div>
            </div>
            <div class="beispiel-flaeche zeigt" id="mDopDemoDiktat">
                <div class="buchstaben-reihe">
                    <div class="kachel" style="width:56px;height:56px;font-size:1.7rem;">K</div>
                    <div class="kachel" style="width:56px;height:56px;font-size:1.7rem;">A</div>
                    <div class="kachel" style="width:56px;height:56px;font-size:1.7rem;">T</div>
                    <div class="kachel" style="width:56px;height:56px;font-size:1.7rem;">Z</div>
                    <div class="kachel" style="width:56px;height:56px;font-size:1.7rem;">E</div>
                </div>
            </div>

            <div class="beispiel-flaeche" id="mDopDemoGram" style="position:absolute;">
                <div class="icon-gross" style="font-size:3.6rem;">🐈</div>
                <div style="display:flex; gap:12px;">
                    <div class="artikel-pille" style="background:#c62828; padding:10px 18px; font-size:1.3rem;">die<div class="abzeichen-klein zeigt" style="width:22px;height:22px;font-size:0.85rem;">✓</div></div>
                    <div class="artikel-pille" style="background:#1565c0; padding:10px 18px; font-size:1.3rem; opacity:0.5;">der</div>
                    <div class="artikel-pille" style="background:#2e7d32; padding:10px 18px; font-size:1.3rem; opacity:0.5;">das</div>
                </div>
            </div>
            <div class="mock-finger" id="mDopFinger">👆</div>
        </div>
    </div>

    <div class="scene" data-icon="🎮">
        <div style="display:flex; align-items:center;"><div class="avatar">🧑</div><div class="verbindungslinie"></div><div class="avatar">🧑</div></div>
        <div class="icon-gross" style="font-size:5rem;">🎮</div>
    </div>

    <div class="scene" data-icon="🧩">
        <div class="puzzle-reihe"><div class="puzzleteil"></div><div class="puzzleteil"></div><div class="puzzleteil"></div><div class="puzzleteil"></div></div>
        <div class="icon-gross" style="font-size:5rem;">🧩</div>
    </div>

    <div id="leiste">
        <button class="steuer-btn" id="btnZurueck" title="zurück">⏮</button>
        <button class="steuer-btn" id="btnPause" title="pause/play">⏸</button>
        <div id="punkte"></div>
        <button class="steuer-btn" id="btnWeiter" title="weiter">⏭</button>
    </div>
</div>

<script>
const szenen = Array.from(document.querySelectorAll('.scene'));
const punkteContainer = document.getElementById('punkte');
let index = 0;
let laeuft = true;
let timer = null;
const DAUER = 4200;

szenen.forEach((s, i) => {
    const p = document.createElement('button');
    p.className = 'punkt';
    p.addEventListener('click', () => { zeigeSzene(i); starteTimer(); });
    punkteContainer.appendChild(p);
});

// ===== Zeiger-Helfer: positioniert den "Finger" exakt über einem Zielelement =====
function fingerZeigenAuf(fingerEl, zielEl, rahmenEl) {
    const zr = zielEl.getBoundingClientRect();
    const rr = rahmenEl.getBoundingClientRect();
    fingerEl.style.left = (zr.left - rr.left + zr.width / 2) + 'px';
    fingerEl.style.top = (zr.top - rr.top) + 'px';
    fingerEl.classList.add('sichtbar');
}
function fingerVerstecken(fingerEl) { fingerEl.classList.remove('sichtbar'); }
function fingerTippt(fingerEl) {
    fingerEl.classList.remove('tippt'); void fingerEl.offsetWidth; fingerEl.classList.add('tippt');
}

// ===== Diktat-Menü-Demo =====
// ===== Hauptsteuerung-Demo: Wort tippen, hören, wiederholen, wechseln, löschen, speichern =====
function macheHauptController(szeneEl) {
    const rahmen = szeneEl.querySelector('.mockup-rahmen');
    const finger = szeneEl.querySelector('#mHauptFinger');
    const w = [1,2,3,4].map(n => szeneEl.querySelector('#mHW' + n));
    const t = [1,2,3,4].map(n => szeneEl.querySelector('#mHT' + n));
    const btnRepeat = szeneEl.querySelector('#mHRepeat');
    const btnListen = szeneEl.querySelector('#mHListen');
    const btnPrev = szeneEl.querySelector('#mHPrev');
    const btnNext = szeneEl.querySelector('#mHNext');
    const btnDel = szeneEl.querySelector('#mHDel');
    const btnSave = szeneEl.querySelector('#mHSave');
    const stern = szeneEl.querySelector('#mHStern');
    const tasten = szeneEl.querySelector('#mHauptTasten');
    const wortA = ['B', 'A', 'L', 'L'];
    const wortB = ['R', 'O', 'S', 'E'];
    let ids = [];
    function plan(ms, fn) { ids.push(setTimeout(fn, ms)); }
    function setzeWort(buchstaben) { w.forEach((el, i) => el.textContent = buchstaben[i] || '＿'); }
    function reset() {
        setzeWort(['＿', '＿', '＿', '＿']);
        fingerVerstecken(finger); stern.classList.remove('zeigt');
        tasten.classList.add('offen');
        [btnRepeat, btnListen, btnPrev, btnNext, btnDel, btnSave].forEach(b => b.style.transform = '');
    }
    function tippeAuf(el, ms) { plan(ms, () => { fingerZeigenAuf(finger, el, rahmen); fingerTippt(finger); }); }
    function zyklus() {
        reset();
        tippeAuf(t[0], 400);  plan(750,  () => setzeWort([wortA[0],'＿','＿','＿']));
        tippeAuf(t[1], 1050); plan(1400, () => setzeWort([wortA[0],wortA[1],'＿','＿']));
        tippeAuf(t[2], 1700); plan(2050, () => setzeWort([wortA[0],wortA[1],wortA[2],'＿']));
        tippeAuf(t[3], 2350); plan(2700, () => setzeWort(wortA));
        plan(3050, () => fingerVerstecken(finger));
        plan(3300, () => { tasten.classList.remove('offen'); });

        tippeAuf(btnListen, 3500);
        plan(3900, () => { btnListen.style.transform = 'scale(1.15)'; });
        plan(4300, () => { btnListen.style.transform = ''; fingerVerstecken(finger); });

        tippeAuf(btnRepeat, 4700);
        plan(5100, () => { btnRepeat.style.transform = 'rotate(200deg)'; });
        plan(5500, () => { btnRepeat.style.transform = ''; fingerVerstecken(finger); });

        tippeAuf(btnNext, 5900);
        plan(6300, () => { w.forEach(el => el.classList.add('wort-wechselt')); });
        plan(6650, () => { setzeWort(wortB); w.forEach(el => el.classList.remove('wort-wechselt')); });
        plan(7000, () => fingerVerstecken(finger));

        tippeAuf(btnDel, 7400);
        plan(7750, () => { setzeWort([wortB[0], wortB[1], wortB[2], '＿']); });
        plan(8050, () => fingerVerstecken(finger));

        tippeAuf(btnSave, 8450);
        plan(8850, () => { stern.classList.add('zeigt'); });
        plan(9250, () => fingerVerstecken(finger));
        plan(10150, () => stern.classList.remove('zeigt'));
    }
    let intervalId = null;
    return {
        start() { zyklus(); intervalId = setInterval(zyklus, 11500); },
        stop() { ids.forEach(clearTimeout); ids = []; if (intervalId) clearInterval(intervalId); reset(); }
    };
}

function macheDiktatController(szeneEl) {
    const rahmen = szeneEl.querySelector('.mockup-rahmen');
    const hauptBtn = szeneEl.querySelector('#mDiktatBtn');
    const menu = szeneEl.querySelector('#mDiktatMenu');
    const beispiel = szeneEl.querySelector('#mDiktatBeispiel');
    const finger = szeneEl.querySelector('#mDiktatFinger');
    const m1 = szeneEl.querySelector('#mD1'), m3 = szeneEl.querySelector('#mD3');
    let ids = [];
    function plan(ms, fn) { ids.push(setTimeout(fn, ms)); }
    function reset() {
        hauptBtn.classList.remove('aktiv'); menu.classList.remove('offen');
        beispiel.classList.remove('zeigt'); fingerVerstecken(finger);
        m1.classList.add('aktiv'); m3.classList.remove('aktiv');
    }
    function zyklus() {
        reset();
        plan(500, () => { fingerZeigenAuf(finger, hauptBtn, rahmen); fingerTippt(finger); });
        plan(1100, () => { hauptBtn.classList.add('aktiv'); menu.classList.add('offen'); fingerVerstecken(finger); });
        plan(2000, () => { fingerZeigenAuf(finger, m3, rahmen); });
        plan(2500, () => { fingerTippt(finger); m1.classList.remove('aktiv'); m3.classList.add('aktiv'); });
        plan(2900, () => { fingerVerstecken(finger); });
        plan(3400, () => { beispiel.classList.add('zeigt'); });
    }
    let intervalId = null;
    return {
        start() { zyklus(); intervalId = setInterval(zyklus, 8200); },
        stop() { ids.forEach(clearTimeout); ids = []; if (intervalId) clearInterval(intervalId); reset(); }
    };
}

// ===== Grammatik-Menü-Demo =====
function macheGrammatikController(szeneEl) {
    const rahmen = szeneEl.querySelector('.mockup-rahmen');
    const hauptBtn = szeneEl.querySelector('#mGramBtn');
    const menu = szeneEl.querySelector('#mGramMenu');
    const beispielArtikel = szeneEl.querySelector('#mGramBeispielArtikel');
    const beispielKasus = szeneEl.querySelector('#mGramBeispielKasus');
    const beispielKonj = szeneEl.querySelector('#mGramBeispielKonj');
    const abzDer = szeneEl.querySelector('#mAbzDer');
    const abzDen = szeneEl.querySelector('#mAbzDen');
    const abzSpiele = szeneEl.querySelector('#mAbzSpiele');
    const finger = szeneEl.querySelector('#mGramFinger');
    const g1 = szeneEl.querySelector('#mG1'), g2 = szeneEl.querySelector('#mG2'), g3 = szeneEl.querySelector('#mG3');
    let ids = [];
    function plan(ms, fn) { ids.push(setTimeout(fn, ms)); }
    function reset() {
        hauptBtn.classList.remove('aktiv'); menu.classList.remove('offen');
        beispielArtikel.classList.remove('zeigt'); beispielKasus.classList.remove('zeigt'); beispielKonj.classList.remove('zeigt');
        abzDer.classList.remove('zeigt'); abzDen.classList.remove('zeigt'); abzSpiele.classList.remove('zeigt');
        fingerVerstecken(finger); g1.classList.add('aktiv'); g2.classList.remove('aktiv'); g3.classList.remove('aktiv');
    }
    function zyklus() {
        reset();
        plan(500, () => { fingerZeigenAuf(finger, hauptBtn, rahmen); fingerTippt(finger); });
        plan(1100, () => { hauptBtn.classList.add('aktiv'); menu.classList.add('offen'); fingerVerstecken(finger); });
        plan(2000, () => { beispielArtikel.classList.add('zeigt'); });
        plan(2600, () => { abzDer.classList.add('zeigt'); });
        plan(4400, () => { beispielArtikel.classList.remove('zeigt'); abzDer.classList.remove('zeigt'); fingerZeigenAuf(finger, g2, rahmen); });
        plan(5000, () => { fingerTippt(finger); g1.classList.remove('aktiv'); g2.classList.add('aktiv'); });
        plan(5400, () => { fingerVerstecken(finger); });
        plan(5900, () => { beispielKasus.classList.add('zeigt'); });
        plan(6500, () => { abzDen.classList.add('zeigt'); });
        plan(8300, () => { beispielKasus.classList.remove('zeigt'); abzDen.classList.remove('zeigt'); fingerZeigenAuf(finger, g3, rahmen); });
        plan(8900, () => { fingerTippt(finger); g2.classList.remove('aktiv'); g3.classList.add('aktiv'); });
        plan(9300, () => { fingerVerstecken(finger); });
        plan(9800, () => { beispielKonj.classList.add('zeigt'); });
        plan(10400, () => { abzSpiele.classList.add('zeigt'); });
    }
    let intervalId = null;
    return {
        start() { zyklus(); intervalId = setInterval(zyklus, 12300); },
        stop() { ids.forEach(clearTimeout); ids = []; if (intervalId) clearInterval(intervalId); reset(); }
    };
}

// ===== Doppelfunktion-Demo: Diktat + Grammatik gleichzeitig aktiv =====
function macheDoppelController(szeneEl) {
    const rahmen = szeneEl.querySelector('.mockup-rahmen');
    const gramBtn = szeneEl.querySelector('#mDopGramBtn');
    const demoDiktat = szeneEl.querySelector('#mDopDemoDiktat');
    const demoGram = szeneEl.querySelector('#mDopDemoGram');
    const finger = szeneEl.querySelector('#mDopFinger');
    const richtig = szeneEl.querySelector('#mDopRichtig');
    const falsch = szeneEl.querySelector('#mDopFalsch');
    let ids = [];
    function plan(ms, fn) { ids.push(setTimeout(fn, ms)); }
    function reset() {
        gramBtn.classList.remove('aktiv'); fingerVerstecken(finger);
        demoDiktat.classList.add('zeigt'); demoGram.classList.remove('zeigt');
        richtig.textContent = '2'; falsch.textContent = '0';
    }
    function zyklus() {
        reset();
        plan(700, () => { fingerZeigenAuf(finger, gramBtn, rahmen); fingerTippt(finger); });
        plan(1300, () => { gramBtn.classList.add('aktiv'); fingerVerstecken(finger); });
        plan(2400, () => { demoDiktat.classList.remove('zeigt'); demoGram.classList.add('zeigt'); richtig.textContent = '3'; });
        plan(4600, () => { demoGram.classList.remove('zeigt'); demoDiktat.classList.add('zeigt'); richtig.textContent = '4'; });
        plan(6800, () => { demoDiktat.classList.remove('zeigt'); demoGram.classList.add('zeigt'); richtig.textContent = '5'; });
    }
    let intervalId = null;
    return {
        start() { zyklus(); intervalId = setInterval(zyklus, 8900); },
        stop() { ids.forEach(clearTimeout); ids = []; if (intervalId) clearInterval(intervalId); reset(); }
    };
}

const controller = {};
const szenenDauer = {};
szenen.forEach((s, i) => {
    const art = s.dataset.controller;
    if (art === 'haupt') { controller[i] = macheHauptController(s); szenenDauer[i] = 11500; }
    if (art === 'diktat') { controller[i] = macheDiktatController(s); szenenDauer[i] = 8200; }
    if (art === 'grammatik') { controller[i] = macheGrammatikController(s); szenenDauer[i] = 12300; }
    if (art === 'doppel') { controller[i] = macheDoppelController(s); szenenDauer[i] = 8900; }
});
let aktiverController = null;

function zeigeSzene(i) {
    if (aktiverController) { aktiverController.stop(); aktiverController = null; }
    index = (i + szenen.length) % szenen.length;
    szenen.forEach((s, n) => s.classList.toggle('aktiv', n === index));
    Array.from(punkteContainer.children).forEach((p, n) => p.classList.toggle('aktiv', n === index));
    if (controller[index]) { aktiverController = controller[index]; aktiverController.start(); }
}

function starteTimer() {
    clearTimeout(timer);
    if (!laeuft) return;
    const dauer = szenenDauer[index] || DAUER;
    timer = setTimeout(() => { zeigeSzene(index + 1); starteTimer(); }, dauer);
}

document.getElementById('btnPause').addEventListener('click', function() {
    laeuft = !laeuft;
    this.textContent = laeuft ? '⏸' : '▶️';
    starteTimer();
});
document.getElementById('btnWeiter').addEventListener('click', () => { zeigeSzene(index + 1); starteTimer(); });
document.getElementById('btnZurueck').addEventListener('click', () => { zeigeSzene(index - 1); starteTimer(); });

zeigeSzene(0);
starteTimer();
</script>

</body>
</html>
