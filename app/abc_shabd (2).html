function globalDictLookup(wort, zielSprache) {
    const eintrag = Object.values(GLOBAL_DICT).find(e => e.hi && e.hi === wort);
    return eintrag ? eintrag[zielSprache] || eintrag.de : null;
}

    <title>एबीसी शब्द</title>
    <style>
        :root {
            --primary: #e65100;
            --secondary: #f9a825;
            --success: #2e7d32;
            --danger: #c62828;
            --purple: #6a1b9a;
            --bg: #fff8f0;
            --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .subtitle { color: #7f8c8d; margin-bottom: 20px; text-align: center; font-size: 0.9rem; }
        .word-display { width: 100%; max-width: 700px; min-height: 100px; background: var(--card-bg); border: 4px dashed var(--primary); border-radius: 20px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; font-size: 2.2rem; color: #333; padding: 15px; flex-wrap: wrap; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        .word-display.empty { color: #bdc3c7; font-size: 1.1rem; font-weight: normal; font-style: italic; }

        .char-block:hover { background: #ffcdd2; border-color: var(--danger); transform: scale(1.05); }
        .char-block::after { content: '✕'; position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .char-block:hover::after { opacity: 1; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 25px; width: 100%; max-width: 700px; }

        button:active { transform: scale(0.95); }
        .keyboard-container { width: 100%; max-width: 800px; background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }

        .section-title { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .keyboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
        .key { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 10px; padding: 12px 4px; text-align: center; font-size: 1.3rem; font-weight: bold; color: #2c3e50; cursor: pointer; transition: all 0.2s; user-select: none; }
        .key.svar { background: #fff3e0; border-color: #ffcc02; color: #e65100; }
        .key.vyanjan { background: #f1f8e9; border-color: #aed581; color: #33691e; }
        .key.matra { background: #e8eaf6; border-color: #9fa8da; color: #283593; font-size: 1.1rem; }
        .key.spezial { background: #fce4ec; border-color: #f48fb1; color: #880e4f; font-size: 0.9rem; }
        .key:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
        .case-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .toggle-switch { position: relative; width: 52px; height: 28px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 28px; cursor: pointer; transition: background 0.2s; }
        .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 4px; top: 4px; background: white; border-radius: 50%; transition: transform 0.2s; }

<script>
// ── Devanagari Tastatur ───────────────────────────────────────────────
const svar    = ['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ','ऋ','अं','अः'];
const vyanjan = ['क','ख','ग','घ','ङ','च','छ','ज','झ','ञ','ट','ठ','ड','ढ','ण','त','थ','द','ध','न','प','फ','ब','भ','म','य','र','ल','व','श','ष','स','ह','क्ष','त्र','ज्ञ'];
const matra   = ['ा','ि','ी','ु','ू','े','ै','ो','ौ','ृ','ं','ः','्'];
const matraNames = ['aa','i','ii','u','uu','e','ai','o','au','ri','an','ah','hal'];
const spezial = ['ँ','ॅ','ॆ','।','॥','ॐ','₹','०','१','२','३','४','५','६','७','८','९'];

// ── Wortliste ─────────────────────────────────────────────────────────
const wordList = ['माँ','घर','पानी','रोटी','किताब','स्कूल','सूरज','चाँद','कुत्ता','बिल्ली','दोस्त','हाथ','नाक','आँख','पेड़'];

// ── HI→DE Dictionary ─────────────────────────────────────────────────
const hiDeDict = {
    'माँ':'Mutter','घर':'Haus','पानी':'Wasser','रोटी':'Brot',
    'किताब':'Buch','स्कूल':'Schule','सूरज':'Sonne','चाँद':'Mond',
    'कुत्ता':'Hund','बिल्ली':'Katze','दोस्त':'Freund','हाथ':'Hand',
    'नाक':'Nase','आँख':'Auge','पेड़':'Baum','खाना':'Essen',
    'जाना':'gehen','बड़ा':'groß','छोटा':'klein','तेज़':'schnell',
    'खुश':'glücklich','उदास':'traurig','गर्म':'heiß','ठंडा':'kalt',
    'नया':'neu','पुराना':'alt','बच्चा':'Kind','गेंद':'Ball',
};

// ── Übersetzungssystem ────────────────────────────────────────────────
const sprachen = [
    { code:'de', flag:'🇩🇪', name:'Deutsch' },
    { code:'en', flag:'🇬🇧', name:'English' },
    { code:'ru', flag:'🇷🇺', name:'Русский' },
    { code:'ar', flag:'🇸🇦', name:'العربية' },
];
let uebersetzungAktiv = false;
let userLang = 'de';
try { userLang = localStorage.getItem('abcshabd_lang') || 'de'; } catch(e) {}
const uebersetzungsCache = {};

function sprachDropdownBauen() {
    const sel = document.getElementById('sprachSelectControls');
    if (!sel) return;
    sel.innerHTML = '';
    sprachen.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.code; opt.textContent = s.flag + ' ' + s.name;
        if (s.code === userLang) opt.selected = true;
        sel.appendChild(opt);
    });
}

function sprachWechseln(code) {
    userLang = code;
    try { localStorage.setItem('abcshabd_lang', code); } catch(e) {}
    const wort = uebersetzungsAktuellesWort();
    if (wort) uebersetzeUndZeige(wort);
}

function uebersetzungToggle() {
    uebersetzungAktiv = document.getElementById('uebersetzungToggleSwitch').checked;
    const dropdown = document.getElementById('sprachDropdownInControls');
    const anzeige  = document.getElementById('uebersetzungAnzeige');
    if (uebersetzungAktiv) {
        if (dropdown) dropdown.style.display = 'block';
        const wort = uebersetzungsAktuellesWort();
        if (wort) uebersetzeUndZeige(wort);
    } else {
        if (dropdown) dropdown.style.display = 'none';
        anzeige.textContent = '';
    }
}

function uebersetzungsAktuellesWort() {
    if (diktatAktiv && diktatAktuell) return diktatAktuell;
    if (grammatikAktiv && grammatikAktuell) return grammatikAktuell.wort || grammatikAktuell.verb || '';
    return '';
}

async function uebersetzeAPI(text) {
    if (!text) return '';
    const key = 'hi:' + userLang + ':' + text;
    if (uebersetzungsCache[key]) return uebersetzungsCache[key];
    if (userLang === 'de' && hiDeDict[text]) {
        uebersetzungsCache[key] = hiDeDict[text];
        return hiDeDict[text];
    }
     const global = globalDictLookup(text, userLang);
    if (global) { uebersetzungsCache[key] = global; return global; }
    try {
        const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=hi|' + userLang;
        const res = await fetch(url);
        if (!res.ok) return '';
        const data = await res.json();
        const result = (data.responseData && data.responseData.translatedText) || '';
        if (result) uebersetzungsCache[key] = result;
        return result;
    } catch(e) { return ''; }
}

function uebersetzeUndZeige(text) {
    if (!uebersetzungAktiv || !text) return;
    const anzeige = document.getElementById('uebersetzungAnzeige');
    const sprache = sprachen.find(s => s.code === userLang);
    const flag    = sprache ? sprache.flag : '🌍';
    const key     = 'hi:' + userLang + ':' + text;
    if (uebersetzungsCache[key]) { anzeige.textContent = flag + ' ' + uebersetzungsCache[key]; return; }
    anzeige.textContent = flag + ' …'; anzeige.classList.add('laden');
    uebersetzeAPI(text).then(r => { anzeige.textContent = r ? flag + ' ' + r : ''; anzeige.classList.remove('laden'); });
}

// ── Hindi Zahlwörter ──────────────────────────────────────────────────
const hindiZahlen = {
    '०':'शून्य','१':'एक','२':'दो','३':'तीन','४':'चार',
    '५':'पाँच','६':'छह','७':'सात','८':'आठ','९':'नौ',
    '0':'शून्य','1':'एक','2':'दो','3':'तीन','4':'चार',
    '5':'पाँच','6':'छह','7':'सात','8':'आठ','9':'नौ',
};

// ── TTS ───────────────────────────────────────────────────────────────
function sprichHi(text) {
    if (!text) return;
    const gesprochen = [...text].map(ch => hindiZahlen[ch] || ch).join(' ');
    window.speechSynthesis.cancel();
    const try_ = () => {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return false;
        const u = new SpeechSynthesisUtterance(gesprochen);
        u.lang = 'hi-IN';
        u.rate = 0.82;
        const hindiVoice = voices.find(v => v.lang.startsWith('hi'));
        if (hindiVoice) u.voice = hindiVoice;
        window.speechSynthesis.speak(u);
        return true;
    };
    if (!try_()) {
        window.speechSynthesis.onvoiceschanged = () => { try_(); };
    }
}
  


function sprichZeichenTTS(ch) {
    // Zahl? → Zahlwort sprechen
    const wort = hindiZahlen[ch];
    sprichHi(wort || ch);
}
function sprichWort() { const s = currentWord.join(''); if (s) sprichHi(s); }

function buildKeyboard() {
    // Svara
    const kbS = document.getElementById('kbSvar');
    svar.forEach(ch => {
        const btn = document.createElement('div');
        btn.className = 'key svar'; btn.textContent = ch;
        btn.addEventListener('click', () => addChar(ch));
        kbS.appendChild(btn);
    });
    // Vyanjan
    const kbV = document.getElementById('kbVyanjan');
    vyanjan.forEach(ch => {
        const btn = document.createElement('div');
        btn.className = 'key vyanjan'; btn.textContent = ch;
        btn.addEventListener('click', () => addChar(ch));
        kbV.appendChild(btn);
    });
    // Matra
    const kbM = document.getElementById('kbMatra');
    matra.forEach((ch, i) => {
        const btn = document.createElement('div');
        btn.className = 'key matra';
        btn.innerHTML = `<span style="font-size:1.1rem;">क${ch}</span><span style="font-size:0.55rem;display:block;color:#888;">${matraNames[i]}</span>`;
        btn.addEventListener('click', () => addChar(ch));
        kbM.appendChild(btn);
    });
    // Spezial (inkl. Devanagari-Ziffern mit Zahlwort-Label)
    const kbSp = document.getElementById('kbSpezial');
    spezial.forEach(ch => {
        const btn = document.createElement('div');
        btn.className = 'key spezial';
        // Devanagari-Ziffern mit Zahlwort anzeigen
        if (hindiZahlen[ch]) {
            btn.style.cssText = 'padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;';
            btn.innerHTML = `<span style="font-size:1.2rem;">${ch}</span><span style="font-size:0.55rem;font-weight:bold;color:#888;">${hindiZahlen[ch]}</span>`;
        } else {
            btn.textContent = ch;
        }
        btn.addEventListener('click', () => addChar(ch));
        kbSp.appendChild(btn);
    });
}

function shuffle(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
    return a;
}

// ── Char / Display ────────────────────────────────────────────────────
let _lastAddTime = 0;
function addChar(ch) {
    const now = Date.now(); if (now - _lastAddTime < 80) return; _lastAddTime = now;
    if (diktatAktiv) { diktatAddChar(ch); return; }
    currentWord.push(ch); updateDisplay(); if (!diktatStumm) sprichZeichenTTS(ch);
}
function backspace() {
    if (diktatAktiv) { diktatEingabe = diktatEingabe.slice(0,-1); diktatRender(); return; }
    currentWord.pop(); updateDisplay();
}
function updateDisplay() {
    const display = document.getElementById('wordDisplay');
    if (diktatAktiv) { diktatRender(); return; }
    display.innerHTML = '';
    if (currentWord.length === 0) { display.classList.add('empty'); display.textContent = 'अक्षरों पर क्लिक करें और शब्द बनाएं'; return; }
    display.classList.remove('empty');
    currentWord.forEach((ch, i) => {
        const span = document.createElement('div'); span.className = 'char-block'; span.textContent = ch;
        span.onclick = () => { currentWord.splice(i,1); updateDisplay(); };
        display.appendChild(span);
    });
}

function randomWord() {
    if (diktatAktiv && grammatikAktiv) { Math.random()>0.5 ? diktatNeuesWort() : grammatikNeueAufgabe(); }
    else if (diktatAktiv) { diktatNeuesWort(); }
    else if (grammatikAktiv) { grammatikNeueAufgabe(); }
    else { const w = wordList[Math.floor(Math.random()*wordList.length)]; currentWord = w.split(''); updateDisplay(); sprichWort(); }
}

function navigiereZurueck() {
    if (diktatAktiv && diktatVerlaufIdx > 0) {
        diktatVerlaufIdx--;
        const e = diktatVerlauf[diktatVerlaufIdx];
        diktatAktuell = e.wort; diktatEingabe = ''; diktatGesperrt = false;
        diktatHatFehler = false; diktatBuzzerGespielt = false; currentWord = [];
        diktatRender(); document.getElementById('diktatStatus').textContent = 'सुनें और शब्द लिखें';
        diktatSprechen();
    }
}

function wiederholenButton() {
    if (grammatikAktiv && !diktatAktiv) { grammatikSprechen(); return; }
    if (diktatAktiv) diktatNochmal(); else sprichWort();
}

function updateModusUI() {
    const beides = diktatAktiv || grammatikAktiv;
    document.getElementById('scoreBereich').style.display       = beides ? 'block' : 'none';
    document.getElementById('niveauSliderBereich').style.display= beides ? 'block' : 'none';
    document.getElementById('diktatStatus').style.display       = beides ? 'block' : 'none';
    document.getElementById('diktatModusBereich').style.display = diktatAktiv ? 'block' : 'none';
    document.getElementById('grammatikZeile').style.display     = grammatikAktiv ? 'flex' : 'none';
    if (!beides) { document.getElementById('diktatStatus').textContent = ''; updateDisplay(); }
}

function diktatToggle() {
    diktatAktiv = document.getElementById('diktatToggleSwitch').checked;
    updateModusUI();
    if (diktatAktiv) {
        if (!freiRundenCheck()) { diktatAktiv = false; document.getElementById('diktatToggleSwitch').checked = false; updateModusUI(); return; }
        diktatNeuesWort();
    } else if (grammatikAktiv) grammatikNeueAufgabe();
}

function grammatikToggle() {
    grammatikAktiv = document.getElementById('grammatikToggleSwitch').checked;
    updateModusUI();
    if (grammatikAktiv) {
        if (!freiRundenCheck()) { grammatikAktiv = false; document.getElementById('grammatikToggleSwitch').checked = false; updateModusUI(); return; }

}

function diktatRender() {
    const display = document.getElementById('wordDisplay'); display.classList.remove('empty');
    if (!diktatAktuell) return;
    const ziel = diktatAktuell;
    // Devanagari: Zeichen-Array korrekt aufteilen
    const zielArr = [...ziel];
    const eingArr = [...diktatEingabe];
    if (diktatModus === 'blind') { display.innerHTML = `<span style="font-size:1.5rem;color:#7f8c8d;">🙈 ${eingArr.length} / ${zielArr.length}</span>`; return; }
    let html = '';
    zielArr.forEach((ch, i) => {
        const entered = eingArr[i];
        if (diktatModus === 'striche') {
            if (!entered) html += `<div class="char-block" style="min-width:28px;border-color:#ccc;background:#f8f9fa;">_</div>`;
            else { const ok = entered === ch; html += `<div class="char-block" style="border-color:${ok?'var(--success)':'var(--danger)'};background:${ok?'#eafaf1':'#fdecea'}">${entered}</div>`; }
        } else {
            if (!entered) html += `<div class="char-block" style="min-width:28px;border-color:#ccc;background:#fafafa;">${ch}</div>`;
            else { const ok = entered === ch; html += `<div class="char-block" style="border-color:${ok?'var(--success)':'var(--danger)'};background:${ok?'#eafaf1':'#fdecea'}">${entered}</div>`; }

let _lastDiktatAddTime = 0;
function diktatAddChar(ch) {
    const now = Date.now(); if (now - _lastDiktatAddTime < 80) return; _lastDiktatAddTime = now;
    if (diktatGesperrt) return;
    const zielArr = [...diktatAktuell]; const eingArr = [...diktatEingabe];
    const idx = eingArr.length; if (idx >= zielArr.length) return;
    diktatEingabe += ch;
    if (!diktatStumm) sprichZeichenTTS(ch);
    if (ch !== zielArr[idx]) {
        diktatHatFehler = true;
        if (!diktatBuzzerGespielt) { diktatBuzzerGespielt = true; diktatBuzzer(); setTimeout(() => { diktatBuzzerGespielt = false; }, 600); }
    }
    diktatRender();
    const neueEingArr = [...diktatEingabe];
    if (neueEingArr.length === zielArr.length && neueEingArr.every((c,i) => c === zielArr[i])) {
        diktatGesperrt = true;
        if (!diktatHatFehler) { diktatRichtig++; document.getElementById('diktatRichtig').textContent = diktatRichtig; document.getElementById('diktatStatus').textContent = 'शाबाश! 🎉'; }

        document.getElementById('diktatStatus').textContent = neueEingArr.length < zielArr.length ? 'जारी रखें…' : 'अभी नहीं…';

        </div>`;
        grammatikSprechen();
    } else if (grammatikModus === 'kasus') {
        const pool = grammatikDaten.kasus[diktatNiveau] || grammatikDaten.kasus.n1;

            <div id="grammatikStatus" class="diktat-status"></div>
        </div>`;
        grammatikSprechen();
    } else if (grammatikModus === 'konjugation') {
        const pool = verbGroups[diktatNiveau] || verbGroups.n1;
        const verb = pool[Math.floor(Math.random() * pool.length)];
        const formen = verbForms[verb]; if (!formen) { grammatikNeueAufgabe(); return; }
        const pIdx = Math.floor(Math.random() * 6); const richtig = formen[pIdx];
        const falsch = shuffle(formen.filter((_,i)=>i!==pIdx)).slice(0,3);
        const alle = shuffle([richtig, ...falsch]); grammatikAktuell = { verb, pIdx, richtig };
        display.innerHTML = `<div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;">

            <div id="grammatikStatus" class="diktat-status"></div>
        </div>`;
        grammatikSprechen();
    } else if (grammatikModus === 'tempus') {
        const pool = [...(grammatikDaten.tempus.n1||[]),...(grammatikDaten.tempus.n2||[]),...(grammatikDaten.tempus.n3||[])];
        const e = pool[Math.floor(Math.random() * pool.length)]; grammatikAktuell = e;
        const alle = shuffle([e.richtig, ...e.falsch]);
        display.innerHTML = `<div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;">
            <div class="grammatik-aufgabe">${e.pronomen} ___ <span style="color:var(--primary)">${e.verb}</span></div>
            <div class="grammatik-hinweis">${e.zeit}</div>

            <div id="grammatikStatus" class="diktat-status"></div>
        </div>`;
    }
    document.getElementById('diktatStatus').textContent = '';
    // Übersetzung anzeigen wenn aktiv
    if (uebersetzungAktiv && grammatikAktuell) {
        const anzeige = document.getElementById('uebersetzungAnzeige');
        let de = '';
        if (grammatikAktuell.deutsch) {
            de = grammatikAktuell.deutsch;
        } else if (grammatikModus === 'konjugation') {
            const pronounDE = ['ich','du','er/sie','wir','ihr','sie'][grammatikAktuell.pIdx] || '';

        else { const gw = grammatikAktuell.wort || grammatikAktuell.verb || ''; if (gw) uebersetzeUndZeige(gw); }
    }
}

let _diktatCtx = null;
function getDiktatCtx() { if (!_diktatCtx) _diktatCtx = new (window.AudioContext || window.webkitAudioContext)(); return _diktatCtx; }
function diktatFanfare() {
    try { const ctx = getDiktatCtx(); const t = ctx.currentTime + 0.05;
        [[523,0],[659,0.13],[784,0.26],[1047,0.39]].forEach(([f,d]) => {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.frequency.value = f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.2,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.3);
            o.connect(g); g.connect(ctx.destination); o.start(t+d); o.stop(t+d+0.3);
        }); } catch(e) {}
}
function diktatBuzzer() {
    try { const ctx = getDiktatCtx(); const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(180,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.18);
        g.gain.setValueAtTime(0.25,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.22);
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.22); } catch(e) {}
}

function crossSellBannerEinfuegen(currentAppId) {
    const andere = APP_REGISTRY.filter(a => a.id !== currentAppId);
    const container = document.createElement('div');
    container.id = 'crossSellBanner';
    container.style.cssText = 'width:100%;max-width:700px;margin-top:24px;background:white;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.08);overflow:hidden;';
    const header = document.createElement('div');
    header.style.cssText = 'padding:12px 16px;font-size:0.8rem;font-weight:bold;color:#7f8c8d;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #f0f0f0;';
    header.textContent = '🌍 Auch verfügbar';
    container.appendChild(header);
    andere.forEach(app => {
        const aktiv = proIstAktiv(app.id);
        const item = document.createElement('div');
        item.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #f8f8f8;cursor:pointer;transition:background 0.15s;';
        item.onmouseenter = () => item.style.background = '#f8f9fa';
        item.onmouseleave = () => item.style.background = 'white';
        item.onclick = () => window.location.href = app.file;
        item.innerHTML = `<div style="display:flex;align-items:center;gap:12px;">
            <span style="font-size:1.8rem;">${app.flag}</span>
            <div><div style="font-weight:bold;color:#2c3e50;font-size:0.95rem;">${app.name}</div>
            <div style="font-size:0.8rem;color:#7f8c8d;">${app.subtitle}</div></div></div>
            <div style="display:flex;align-items:center;gap:8px;">
            ${aktiv ? '<span style="background:#eafaf1;color:#27ae60;font-size:0.75rem;font-weight:bold;padding:3px 8px;border-radius:20px;">✓ Aktiviert</span>'
                    : '<span style="background:#fff8e1;color:#e67e22;font-size:0.75rem;font-weight:bold;padding:3px 8px;border-radius:20px;">✨ Entdecken</span>'}
            <span style="color:#bdc3c7;font-size:1.2rem;">›</span></div>`;
        container.appendChild(item);
    });
    const aktiviertePros = APP_REGISTRY.filter(a => a.proCode && proIstAktiv(a.id));
    if (aktiviertePros.length >= 2) {
        const hub = document.createElement('div');
        hub.style.cssText = 'padding:12px 16px;background:linear-gradient(135deg,#667eea22,#764ba222);display:flex;align-items:center;justify-content:space-between;';
        hub.innerHTML = '<div><div style="font-weight:bold;color:#2c3e50;font-size:0.9rem;">🏆 Pro Plus Hub</div><div style="font-size:0.75rem;color:#7f8c8d;">Alle Sprachen in einer App — bald verfügbar</div></div><span style="background:#e8e8f5;color:#6c5ce7;font-size:0.75rem;font-weight:bold;padding:3px 8px;border-radius:20px;">Bald</span>';
        container.appendChild(hub);
    }
    const kb = document.querySelector('.keyboard-container');
    if (kb && kb.parentNode) kb.parentNode.insertBefore(container, kb.nextSibling);
    else document.body.appendChild(container);
}
// === ENDE PRO-SYSTEM ===

// ── Init ──────────────────────────────────────────────────────────────
function init() {
    buildKeyboard();
    updateDisplay();
    sprachDropdownBauen();
    crossSellBannerEinfuegen(THIS_APP_ID);
}

window.addEventListener('DOMContentLoaded', init);

// Viewport-Fix Mobile
(function() {
    if (!window.visualViewport) return;
    window.visualViewport.addEventListener('resize', function() {
        if ((window.innerHeight - window.visualViewport.height) > 100) {
            var display = document.getElementById('wordDisplay');
            if (display) setTimeout(function() { display.scrollIntoView({ behavior:'smooth', block:'start' }); }, 150);
        }
    });
})();
